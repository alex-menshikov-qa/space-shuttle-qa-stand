{# A page whose real content arrives in a later stage: title + one line. #}
{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block page %}{{ page }}{% endblock %}
{% block content %}
<h1 class="page__title" data-testid="{{ page }}-title">{{ title }}</h1>
<section class="placeholder" data-testid="{{ page }}-placeholder">
  <p>{{ text }}</p>
</section>
{% endblock %}
