<header class="header">
  <nav class="header__nav">
    <a class="header__logo" href="/" id="header-logo" data-testid="header-logo">{{ t.LOGO_TEXT }}</a>
    {% for item in nav_items %}
    <a class="header__link" href="{{ item.href }}" id="{{ item.testid }}" data-testid="{{ item.testid }}">{{ item.label }}</a>
    {% endfor %}
    <a class="header__link header__link--account" href="{{ '/account' if user else '/login' }}" id="header-account-link" data-testid="header-account-link">{{ t.NAV_ACCOUNT }}</a>
  </nav>
</header>
