name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  ALLURE_VERSION: "2.46.1"
  # Where the Allure report of the latest main run is published (GitHub Pages).
  PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  stand-and-tests:
    name: Stand + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.publish.outputs.publish }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # TEST_HOOKS is off in .env.example; the tests need the per-order time
      # shift to reach time-dependent order statuses, so CI switches it on.
      - name: Create .env from .env.example
        run: |
          cp .env.example .env
          sed -i 's/^TEST_HOOKS=.*/TEST_HOOKS=1/' .env
          grep -q '^TEST_HOOKS=1$' .env

      # BASE_URL, TEST_EMAIL, DB_HOST, ... become env vars for the steps below.
      - name: Export .env to the job environment
        run: grep -Ev '^[[:space:]]*(#|$)' .env >> "$GITHUB_ENV"

      - name: Start the stand
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Health check
        run: curl -fsS "$BASE_URL/health"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      # The runner image ships both browsers and their drivers; Selenium Manager
      # finds them, so UI tests need no extra setup. Fails if any is missing.
      - name: Browsers and drivers on the runner
        run: |
          google-chrome --version
          "$CHROMEWEBDRIVER/chromedriver" --version
          firefox --version
          "$GECKOWEBDRIVER/geckodriver" --version

      - name: Run tests
        run: |
          set +e
          pytest
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "::notice title=No tests collected::pytest exit code 5 (no tests collected yet) is treated as success"
            exit 0
          fi
          exit "$code"

      # Only runs on main are published. A PR run, or a main run that produced
      # no test results (the stand never started), must not replace the report.
      - name: Decide whether to publish the report
        id: publish
        if: ${{ !cancelled() }}
        run: |
          publish=false
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ] \
            && ls allure-results/*-result.json >/dev/null 2>&1; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "publish=$publish"

      # Allure draws the trend from the history of the previous report, so take
      # it from the published site. No site yet (first run) means no trend yet.
      - name: Restore Allure history from the published report
        if: ${{ !cancelled() && steps.publish.outputs.publish == 'true' }}
        run: |
          mkdir -p allure-results/history
          for f in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
            if ! curl -fsSL --retry 2 -o "allure-results/history/$f" "$PAGES_URL/history/$f"; then
              rm -f "allure-results/history/$f"
              echo "::notice title=Allure history::$f is not published yet, the trend starts from this run"
            fi
          done
          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildOrder": ${GITHUB_RUN_NUMBER},
            "buildName": "CI #${GITHUB_RUN_NUMBER}",
            "buildUrl": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "reportUrl": "${PAGES_URL}/",
            "reportName": "Allure report"
          }
          EOF

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: |
          java -version
          curl -fsSL -o allure.tgz \
            "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar -xzf allure.tgz
          mkdir -p allure-results
          "./allure-${ALLURE_VERSION}/bin/allure" generate allure-results -o allure-report --clean

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: error

      - name: Upload the report for GitHub Pages
        if: ${{ !cancelled() && steps.publish.outputs.publish == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

      - name: Stand logs
        if: failure()
        run: docker compose logs

      - name: Stop the stand
        if: always()
        run: docker compose down -v

  # Published even when tests failed: that is when the report is needed most.
  publish-report:
    name: Publish Allure report
    needs: stand-and-tests
    if: ${{ !cancelled() && needs.stand-and-tests.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
