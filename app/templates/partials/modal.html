{#
  Modal window: hidden until modal.js opens it. The caller block is the body.
  testid/id is `<name>-modal`; the backdrop only closes it when `dismissible`.
#}
{% macro modal(name, dismissible=False) -%}
<div class="modal" hidden id="{{ name }}-modal" data-testid="{{ name }}-modal"
     {%- if dismissible %} data-dismissible{% endif %}>
  <div class="modal__dialog" role="dialog" aria-modal="true">
    {{ caller() }}
  </div>
</div>
{%- endmacro %}
